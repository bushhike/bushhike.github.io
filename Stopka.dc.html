<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
</helmet>
<footer style="border-top:1px solid var(--color-text);margin-top:var(--space-8)">
  <div style="max-width:1180px;margin:0 auto;padding:var(--space-8) var(--space-6);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-6)">
    <div style="display:flex;flex-direction:column;gap:var(--space-2)">
      <div style="font-family:var(--font-heading);font-weight:800;font-size:24px;letter-spacing:0.02em;text-transform:uppercase">bushhike</div>
      <p style="margin:0;font-size:14px;opacity:0.75;max-width:26ch">Karol i Kasia. Góry, chodzenie i mata na trawie.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:var(--space-2);font-size:14px">
      <h6 style="margin:0 0 var(--space-1)">Strona</h6>
      <a href="/trasy/" style="color:inherit;text-decoration:none" style-hover="color:var(--color-accent)">Pomysły na trasy</a>
      <a href="/oferta/" style="color:inherit;text-decoration:none" style-hover="color:var(--color-accent)">Oferta</a>
      <a href="/wyjazdy/" style="color:inherit;text-decoration:none" style-hover="color:var(--color-accent)">Wyjazdy</a>
      <a href="/o-nas/" style="color:inherit;text-decoration:none" style-hover="color:var(--color-accent)">O nas</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:var(--space-2);font-size:14px">
      <h6 style="margin:0 0 var(--space-1)">Kontakt</h6>
      <a href="mailto:bushhike.contact@gmail.com" style="color:inherit;text-decoration:none" style-hover="color:var(--color-accent)">bushhike.contact@gmail.com</a>
      <a href="tel:+48790858578" style="color:inherit;text-decoration:none" style-hover="color:var(--color-accent)">+48 790 858 578</a>
      <a href="https://www.instagram.com/bushhike/" target="_blank" rel="noopener" style="color:inherit;text-decoration:none" style-hover="color:var(--color-accent)">Instagram @bushhike</a>
    </div>
  </div>
  <div style="max-width:1180px;margin:0 auto;padding:0 var(--space-6) var(--space-6);font-size:12px;opacity:0.55">© 2026 bushhike</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:340}}"></script>
</body>
</html>
