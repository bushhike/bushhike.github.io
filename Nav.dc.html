<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
</helmet>
<div style="border-bottom:1px solid var(--color-divider)">
  <nav style="display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-6);max-width:1180px;margin:0 auto;padding:var(--space-4) var(--space-6)">
    <a href="Bushhike.dc.html" style="font-family:var(--font-heading);font-weight:800;font-size:21px;color:var(--color-text);text-decoration:none;margin-right:auto;letter-spacing:0.02em;text-transform:uppercase">bushhike</a>
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-6)">
      <a href="Trasy.dc.html" aria-current="{{ curTrasy }}" style="color:inherit;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding-bottom:3px" style-hover="box-shadow:inset 0 -2px 0 var(--color-accent)">Trasy</a>
      <a href="Oferta.dc.html" aria-current="{{ curOferta }}" style="color:inherit;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding-bottom:3px" style-hover="box-shadow:inset 0 -2px 0 var(--color-accent)">Oferta</a>
      <a href="Wyjazdy.dc.html" aria-current="{{ curWyjazdy }}" style="color:inherit;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding-bottom:3px" style-hover="box-shadow:inset 0 -2px 0 var(--color-accent)">Wyjazdy</a>
      <a href="O-nas.dc.html" aria-current="{{ curOnas }}" style="color:inherit;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding-bottom:3px" style-hover="box-shadow:inset 0 -2px 0 var(--color-accent)">O nas</a>
      <a class="btn btn-primary" href="Kontakt.dc.html">Kontakt</a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;trasy&quot;,&quot;oferta&quot;,&quot;wyjazdy&quot;,&quot;onas&quot;,&quot;kontakt&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active;
    const f = (k) => (a === k ? "page" : null);
    return {
      curTrasy: f("trasy"), curOferta: f("oferta"),
      curWyjazdy: f("wyjazdy"), curOnas: f("onas"),
    };
  }
}
</script>
</body>
</html>
